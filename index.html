<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Toán 9 – Cuối học kì I</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2430;--mut:#5c6b7a;--bd:#d5dde8;--pri:#2f5bd8;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--sel:#e0e9ff}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#1a212c;--tx:#e8edf4;--mut:#9aa8b8;--bd:#2f3a49;--pri:#7aa2ff;--ok:#4ade80;--okb:#0f3a22;--no:#f87171;--nob:#43181a;--sel:#243457}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2rem 0 .6rem}
h2{font-size:1.1rem;margin:1.4rem 0 .2rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}
.note{color:var(--mut);font-size:.92rem;margin:.1rem 0 .6rem}
label{display:block;font-weight:600;margin:.6rem 0 .25rem}
select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 14px;min-height:46px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
button.code{flex:1 1 90px;font-weight:700}
button.code.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.q{margin:14px 0 4px;padding-bottom:10px;border-bottom:1px dashed var(--bd)}
.q:last-child{border-bottom:0}
.qt{font-weight:600;margin-bottom:8px}
.qt small{color:var(--mut);font-weight:400}
.opt{display:block;width:100%;text-align:left;margin:6px 0;line-height:1.5}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.part{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin:8px 0}
.part button{min-width:64px}
.part button.sel{background:var(--sel);border-color:var(--pri);font-weight:700}
.part button.ok{background:var(--okb);border-color:var(--ok)}
.part button.no{background:var(--nob);border-color:var(--no)}
.tln input{width:100%}
.sol{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:.95rem}
.sol b.g{color:var(--ok)} .sol b.r{color:var(--no)}
#bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 16px}
#bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center;font-size:.92rem}
#prog{flex:1;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--pri)}
.big{font-size:2.4rem;font-weight:800;text-align:center;margin:.2rem 0}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--bd)}
.hide{display:none}
.msg{padding:9px 12px;border-radius:10px;margin:8px 0;font-size:.95rem}
.msg.ok{background:var(--okb)} .msg.no{background:var(--nob)} .msg.wait{background:var(--sel)}
.katex{font-size:1.06em}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mdl{max-width:420px;width:100%;margin:0}
</style>
</head>
<body>
<div id="bar" class="hide"><div class="in"><span id="pc">0/30</span><div id="prog"><i></i></div><span id="tm"></span></div></div>
<div class="wrap">
<div id="home">
  <h1>Ôn tập Toán 9 – Cuối học kì I</h1>
  <div class="card">
    <label for="flt">Họ và tên (lớp 9.1)</label><input id="flt" type="text" placeholder="Gõ vài chữ để tìm tên" autocomplete="off" style="margin-bottom:8px"><select id="nm"></select>
    <input id="cl" type="hidden" value="9.1">

    <p class="note">Thang điểm 10: Phần I 3,0 · Phần II 3,0 · Phần III 2,0 · Phần IV 2,0. Khi nộp bài, điểm được tự động gửi cho cô giáo.</p>
    <button class="pri" id="go" style="width:100%">Bắt đầu làm bài</button>

  <div class="card"><b id="who"></b>
    <div class="row" style="margin-top:8px"><button id="shuf">🔀 Tráo đề</button><button id="back">Về trang đầu</button></div>
    <p class="note" style="margin-bottom:0">“Tráo đề” đổi thứ tự câu và phương án (nội dung mã đề không đổi); bài đang làm sẽ bị xóa.</p></div>
  <div id="paper"></div>
  <button class="pri" id="sub" style="width:100%;margin:14px 0">Nộp bài</button>
</div>

</div>

<script>
const SRC=[{"nlc": [{"q": "Tập nghiệm của phương trình (2x − 3)(x + 5) = 0 là", "opts": ["x = −$\\dfrac{3}{2}$ hoặc x = 5", "x = $\\dfrac{3}{2}$ hoặc x = −5", "x = $\\dfrac{3}{2}$ hoặc x = 5", "x = −$\\dfrac{3}{2}$ hoặc x = −5"], "ans": 1, "sol": "Tích bằng 0 khi một thừa số bằng 0: 2x − 3 = 0 ⇒ x = $\\dfrac{3}{2}$; x + 5 = 0 ⇒ x = −5.", "t": "DS1"}, {"q": "Cặp số nào sau đây là nghiệm của hệ phương trình $\\begin{cases}2x - y = 4\\\\ x + 3y = 9\\end{cases}$ ?", "opts": ["(2; 3)", "(4; 4)", "(3; 2)", "(1; −2)"], "ans": 2, "sol": "Thay (3; 2): 2·3 − 2 = 4 và 3 + 3·2 = 9, thỏa mãn cả hai phương trình. Các cặp còn lại không thỏa phương trình thứ hai.", "t": "DS2"}, {"q": "Số nguyên nhỏ nhất thỏa mãn bất phương trình 3(x − 1) ≤ 5x + 7 là", "opts": ["−5", "−4", "−6", "5"], "ans": 0, "sol": "3x − 3 ≤ 5x + 7 ⇒ −2x ≤ 10 ⇒ x ≥ −5 (chia hai vế cho −2 thì đổi chiều). Số nguyên nhỏ nhất là −5.", "t": "DS3"}, {"q": "Căn bậc hai của 64 là", "opts": ["8", "−8", "32", "8 và −8"], "ans": 3, "sol": "Số dương 64 có hai căn bậc hai là 8 và −8 (căn bậc hai số học của 64 là 8).", "t": "DS4"}, {"q": "Giá trị của $\\sqrt[3]{-125}$ bằng", "opts": ["−5", "5", "−25", "±5"], "ans": 0, "sol": "Căn bậc ba của −125 là −5 vì (−5$)^{3}$ = −125.", "t": "DS4"}, {"q": "Giá trị của biểu thức $\\sqrt{45} + \\sqrt{20} - \\sqrt{5}$ bằng", "opts": ["$\\sqrt{60}$", "$5\\sqrt{5}$", "$4\\sqrt{5}$", "$2\\sqrt{5}$"], "ans": 2, "sol": "√45 = 3√5; √20 = 2√5 nên 3√5 + 2√5 − √5 = 4√5.", "t": "DS5"}, {"q": "Giá trị của biểu thức $\\dfrac{1}{\\sqrt{7} - \\sqrt{5}} - \\dfrac{1}{\\sqrt{7} + \\sqrt{5}}$ bằng", "opts": ["$2\\sqrt{5}$", "2", "$\\sqrt{7}$", "$\\sqrt{5}$"], "ans": 3, "sol": "Trục căn thức: $\\dfrac{1}{\\sqrt{7} - \\sqrt{5}} = \\dfrac{\\sqrt{7} + \\sqrt{5}}{2}$ và $\\dfrac{1}{\\sqrt{7} + \\sqrt{5}} = \\dfrac{\\sqrt{7} - \\sqrt{5}}{2}$. Hiệu bằng $\\dfrac{2\\sqrt{5}}{2} = \\sqrt{5}$.", "t": "DS5"}, {"q": "Cho tam giác ABC vuông tại A. Tỉ số $\\dfrac{AB}{BC}$ bằng", "opts": ["cos C", "sin C", "tan C", "cot C"], "ans": 1, "sol": "AB là cạnh đối của góc C, BC là cạnh huyền nên AB/BC = sin C.", "t": "HH1"}, {"q": "Cho đường tròn (O) và hai điểm A, B thuộc (O) sao cho $\\widehat{AOB}$ = 80°. Số đo cung lớn AB bằng", "opts": ["280°", "80°", "100°", "160°"], "ans": 0, "sol": "Số đo cung nhỏ AB bằng số đo góc ở tâm AOB = 80° nên số đo cung lớn AB là 360° − 80° = 280°.", "t": "HH2"}, {"q": "Diện tích hình vành khuyên giới hạn bởi hai đường tròn đồng tâm có bán kính 7 cm và 4 cm bằng", "opts": ["3π cm²", "65π cm²", "33π cm²", "9π cm²"], "ans": 2, "sol": "S = π($7^{2}$ − $4^{2}$) = π(49 − 16) = 33π (cm²).", "t": "HH2"}, {"q": "Cho hai đường tròn (O; 8 cm) và (O′; 3 cm) có OO′ = 5 cm. Hai đường tròn đó", "opts": ["tiếp xúc ngoài", "tiếp xúc trong", "cắt nhau", "không giao nhau"], "ans": 1, "sol": "OO′ = 8 − 3 = R − r nên hai đường tròn tiếp xúc trong.", "t": "HH2"}, {"q": "Cho đường tròn (O; R). Từ điểm M nằm ngoài (O) kẻ hai tiếp tuyến MA, MB sao cho $\\widehat{AMB}$ = 60°. Độ dài OM bằng", "opts": ["R", "$R\\sqrt{3}$", "$R\\sqrt{2}$", "2R"], "ans": 3, "sol": "MO là tia phân giác của $\\widehat{AMB}$ nên $\\widehat{AMO}$ = 30°. Tam giác OAM vuông tại A (OA ⊥ MA) có OA = OM · sin 30° = OM : 2, suy ra OM = 2R.", "t": "HH3"}], "nlcx": [{"q": "Hà mua 5 quyển vở loại 1 và 3 quyển vở loại 2 hết 69 nghìn đồng; Lan mua 3 quyển vở loại 1 và 4 quyển vở loại 2 cùng loại hết 59 nghìn đồng. Giá một quyển vở loại 2 là", "opts": ["9 nghìn đồng", "8 nghìn đồng", "7 nghìn đồng", "12 nghìn đồng"], "ans": 1, "sol": "Gọi giá vở loại 1, loại 2 là a, b (nghìn đồng): 5a + 3b = 69 và 3a + 4b = 59. Nhân 4 và 3 rồi trừ: 11a = 99 ⇒ a = 9; b = 8.", "t": "DS2"}, {"q": "Một xe taxi tính cước 10 000 đồng cho 1 km đầu tiên và 12 000 đồng cho mỗi km tiếp theo. Với 200 000 đồng, hành khách đi được nhiều nhất bao nhiêu ki-lô-mét (là số nguyên)?", "opts": ["16 km", "17 km", "15 km", "18 km"], "ans": 0, "sol": "Đi x km (x ≥ 1): 10 000 + 12 000(x − 1) ≤ 200 000 ⇒ x − 1 ≤ 15,83 ⇒ x ≤ 16,83. Vậy x lớn nhất là 16.", "t": "DS3"}, {"q": "Giá trị của biểu thức $\\sqrt{9 + 4\\sqrt{5}} - \\sqrt{9 - 4\\sqrt{5}}$ là", "opts": ["$2\\sqrt{5}$", "$4\\sqrt{5}$", "4", "2"], "ans": 2, "sol": "9 ± 4√5 = (√5 ± 2)². Vậy biểu thức = (√5 + 2) − (√5 − 2) = 4.", "t": "DS5"}, {"q": "Một chiếc thang dài 6 m dựa vào tường, tạo với mặt đất góc 60°. Đầu trên của thang cách mặt đất", "opts": ["3 m", "$6\\sqrt{3}$ m", "6 m", "$3\\sqrt{3}$ m"], "ans": 3, "sol": "Độ cao = 6 · sin 60° = 6 · √3/2 = 3√3 (m).", "t": "HH1"}, {"q": "Một chiếc quạt giấy gồm hình quạt tròn bán kính 30 cm bị cắt bỏ hình quạt tròn đồng tâm bán kính 10 cm, góc ở tâm 120°. Diện tích phần giấy là", "opts": ["$\\dfrac{800\\pi }{3}$ cm²", "$\\dfrac{400\\pi }{3}$ cm²", "800π cm²", "$\\dfrac{200\\pi }{3}$ cm²"], "ans": 0, "sol": "S = π(30² − 10²) · 120 : 360 = 800π/3 (cm²).", "t": "HH2"}, {"q": "Từ điểm M cách tâm O của đường tròn (O; 5 cm) một khoảng 13 cm, kẻ tiếp tuyến MA (A là tiếp điểm). Độ dài MA là", "opts": ["8 cm", "10 cm", "12 cm", "144 cm"], "ans": 2, "sol": "Tam giác OAM vuông tại A: MA = √(13² − 5²) = √144 = 12 (cm).", "t": "HH3"}], "ds": [{"q": "Cho hai số $a = 4 + \\sqrt{7}$ và $b = 4 - \\sqrt{7}$. Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "Tích a · b = 9.", "ans": true, "sol": "ab = $4^{2}$ − (√7$)^{2}$ = 16 − 7 = 9.", "tp": "DS5"}, {"t": "Tổng $a + b = 8 + 2\\sqrt{7}$.", "ans": false, "sol": "a + b = (4 + √7) + (4 − √7) = 8 (hai căn thức đối nhau triệt tiêu).", "tp": "DS5"}, {"t": "Hiệu $a - b = 2\\sqrt{7}$.", "ans": true, "sol": "a − b = (4 + √7) − (4 − √7) = 2√7.", "tp": "DS5"}, {"t": "Ta có −3a > −3b.", "ans": false, "sol": "a − b = 2√7 > 0 nên a > b. Nhân hai vế với −3 (số âm) thì đổi chiều: −3a < −3b.", "tp": "DS3"}]}, {"q": "Cho đường tròn (O; 6 cm) và dây $AB = 6\\sqrt{3}$ cm. Gọi H là trung điểm của AB. Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "OH vuông góc với AB.", "ans": true, "sol": "H là trung điểm của dây AB (không đi qua tâm) nên OH ⊥ AB.", "tp": "HH2"}, {"t": "AB là đường kính của đường tròn (O).", "ans": false, "sol": "Đường kính của (O) dài 12 cm, còn AB = 6√3 ≈ 10,39 cm < 12 cm nên AB không là đường kính.", "tp": "HH2"}, {"t": "Độ dài cung nhỏ AB bằng 4π cm.", "ans": true, "sol": "AH = 3√3, OA = 6 nên sin $\\widehat{AOH}$ = AH : OA = √3/2, suy ra $\\widehat{AOH}$ = 60° và $\\widehat{AOB}$ = 120°. Độ dài cung nhỏ AB là l = π·6·120 : 180 = 4π (cm).", "tp": "HH2"}, {"t": "Đường tròn (O; 3 cm) tiếp xúc với đường thẳng AB.", "ans": true, "sol": "O$H^{2}$ = O$A^{2}$ − A$H^{2}$ = 36 − 27 = 9 nên OH = 3 cm. Khoảng cách từ O đến AB bằng bán kính 3 cm nên AB tiếp xúc với (O; 3 cm) tại H.", "tp": "HH3"}]}], "tln": [{"q": "Tính giá trị của biểu thức $\\dfrac{\\sqrt{75}}{\\sqrt{3}} + \\sqrt[3]{125}$.", "ans": "10", "sol": "$\\dfrac{\\sqrt{75}}{\\sqrt{3}} = \\sqrt{25} = 5$ và $\\sqrt[3]{125} = 5$ nên kết quả là 10.", "t": "DS4"}, {"q": "Biết (x; y) là nghiệm của hệ phương trình $\\begin{cases}5x - 3y = 1\\\\ 2x + 3y = 13\\end{cases}$. Tính $x^{2} + y^{2}$.", "ans": "13", "sol": "Cộng hai phương trình: 7x = 14 ⇒ x = 2; thay vào phương trình thứ hai: 4 + 3y = 13 ⇒ y = 3. Vậy $x^{2}$ + $y^{2}$ = 4 + 9 = 13.", "t": "DS2"}, {"q": "Cho tam giác ABC vuông tại A có $\\widehat{B}$ = 60° và đường cao $AH = 2\\sqrt{3}$ cm. Tính độ dài cạnh BC (đơn vị: cm).", "ans": "8", "sol": "Tam giác ABH vuông tại H: AB = AH : sin 60° = 2√3 : (√3/2) = 4 cm. Tam giác ABC vuông tại A: BC = AB : cos 60° = 4 : (1/2) = 8 cm.", "t": "HH1"}, {"q": "Cho đường tròn (O; 9 cm). Từ điểm M cách O một khoảng 15 cm kẻ hai tiếp tuyến MA, MB tới đường tròn (A, B là các tiếp điểm). Tính độ dài dây AB (đơn vị: cm).", "ans": "14,4", "sol": "MA ⊥ OA nên M$A^{2}$ = 1$5^{2}$ − $9^{2}$ = 144, MA = 12 cm. OM là đường trung trực của AB; gọi H là giao điểm của OM và AB thì AH ⊥ OM. Diện tích tam giác OAM: AH · OM = OA · MA ⇒ AH = 9·12 : 15 = 7,2 cm. Vậy AB = 2 · 7,2 = 14,4 cm.", "t": "HH3"}]}, {"nlc": [{"q": "Phương trình (3x + 6)(x − 4) = 0 có tập nghiệm là", "opts": ["x = 2 hoặc x = 4", "x = −2 hoặc x = −4", "x = −2 hoặc x = 4", "x = 2 hoặc x = −4"], "ans": 2, "sol": "3x + 6 = 0 ⇒ x = −2; x − 4 = 0 ⇒ x = 4.", "t": "DS1"}, {"q": "Hai số x và y có tổng bằng 12 và hiệu bằng 4 (x > y). Cặp số (x; y) là", "opts": ["(8; 4)", "(6; 6)", "(10; 2)", "(4; 8)"], "ans": 0, "sol": "Cộng hai vế của x + y = 12 và x − y = 4 được 2x = 16 ⇒ x = 8, y = 4.", "t": "DS2"}, {"q": "Một thang máy chở tối đa 600 kg. Người điều khiển nặng 65 kg, mỗi bao xi măng nặng 25 kg. Số bao xi măng nhiều nhất thang máy có thể chở cùng người điều khiển là", "opts": ["22 bao", "24 bao", "20 bao", "21 bao"], "ans": 3, "sol": "Gọi x là số bao: 25x + 65 ≤ 600 ⇒ x ≤ 21,4. Vì x nguyên nên x lớn nhất là 21.", "t": "DS3"}, {"q": "Một mảnh vườn hình vuông có diện tích 169 m². Độ dài cạnh của mảnh vườn là", "opts": ["12 m", "13 m", "14 m", "26 m"], "ans": 1, "sol": "Cạnh = √169 = 13 (m).", "t": "DS4"}, {"q": "Một thùng chứa hình lập phương có thể tích 343 dm³. Độ dài cạnh của thùng là", "opts": ["49 dm", "7 dm", "3,5 dm", "14 dm"], "ans": 1, "sol": "Cạnh = ∛343 = 7 (dm) vì $7^{3}$ = 343.", "t": "DS4"}, {"q": "Một mảnh vườn hình chữ nhật có chiều dài $\\sqrt{45}$ m và chiều rộng $\\sqrt{20}$ m. Chu vi mảnh vườn là", "opts": ["$5\\sqrt{5}$ m", "$2\\sqrt{65}$ m", "$10\\sqrt{2}$ m", "$10\\sqrt{5}$ m"], "ans": 3, "sol": "√45 = 3√5; √20 = 2√5. Chu vi = 2(3√5 + 2√5) = 10√5 (m).", "t": "DS5"}, {"q": "Một mảnh đất hình chữ nhật có chiều dài $\\dfrac{2}{\\sqrt{3} - 1}$ m và chiều rộng $\\dfrac{2}{\\sqrt{3} + 1}$ m. Chiều dài hơn chiều rộng", "opts": ["2 m", "$2\\sqrt{3}$ m", "1 m", "4 m"], "ans": 0, "sol": "Trục căn thức: $\\dfrac{2}{\\sqrt{3} - 1} = \\sqrt{3} + 1$ và $\\dfrac{2}{\\sqrt{3} + 1} = \\sqrt{3} - 1$. Hiệu bằng (√3 + 1) − (√3 − 1) = 2 (m).", "t": "DS5"}, {"q": "Một chiếc thang dài 5 m dựa vào bức tường thẳng đứng, chân thang cách tường 3 m. Gọi α là góc giữa thang và mặt đất. Khi đó cos α bằng", "opts": ["$\\dfrac{4}{5}$", "$\\dfrac{3}{4}$", "$\\dfrac{3}{5}$", "$\\dfrac{5}{3}$"], "ans": 2, "sol": "Thang là cạnh huyền (5 m), khoảng cách từ chân thang đến tường là cạnh kề của góc α (3 m) nên cos α = 3/5.", "t": "HH1"}, {"q": "Một chiếc bánh pizza hình tròn được cắt thành 8 miếng hình quạt bằng nhau. Số đo cung của mỗi miếng bánh là", "opts": ["30°", "60°", "45°", "90°"], "ans": 2, "sol": "360° : 8 = 45°.", "t": "HH2"}, {"q": "Một vòng hoa hình vành khuyên giới hạn bởi hai đường tròn đồng tâm có bán kính 10 m và 6 m. Diện tích vòng hoa bằng", "opts": ["64π m²", "16π m²", "136π m²", "4π m²"], "ans": 0, "sol": "S = π(1$0^{2}$ − $6^{2}$) = π(100 − 36) = 64π (m²).", "t": "HH2"}, {"q": "Hai bánh xe ròng rọc hình tròn có bán kính 12 cm và 5 cm, khoảng cách giữa hai tâm là 17 cm. Hai đường tròn đó", "opts": ["tiếp xúc trong", "cắt nhau", "không giao nhau", "tiếp xúc ngoài"], "ans": 3, "sol": "OO′ = 17 = 12 + 5 = R + r nên hai đường tròn tiếp xúc ngoài.", "t": "HH2"}, {"q": "Bạn Mai dán 5 hình tròn bán kính lần lượt 3 cm, 5 cm, 6 cm, 7 cm, 9 cm lên tờ giấy. Tâm của các hình tròn đều nằm trên đường thẳng b; đường thẳng a song song với b và cách b một khoảng 5 cm. Có bao nhiêu hình tròn cắt đường thẳng a tại hai điểm phân biệt?", "opts": ["2", "3", "4", "1"], "ans": 1, "sol": "Khoảng cách từ tâm đến a là 5 cm. Đường thẳng a cắt hình tròn tại hai điểm khi bán kính > 5 cm: các hình bán kính 6; 7; 9 cm, có 3 hình. (Hình bán kính 5 cm chỉ tiếp xúc với a, hình bán kính 3 cm không giao với a.)", "t": "HH3"}], "nlcx": [{"q": "Một số tự nhiên có hai chữ số có tổng hai chữ số bằng 11. Nếu đổi chỗ hai chữ số thì được số mới lớn hơn số ban đầu 27 đơn vị. Số ban đầu là", "opts": ["47", "74", "38", "56"], "ans": 0, "sol": "Gọi chữ số hàng chục là x, hàng đơn vị là y: x + y = 11 và (10y + x) − (10x + y) = 27 ⇒ y − x = 3. Suy ra x = 4, y = 7; số ban đầu là 47.", "t": "DS2"}, {"q": "Bài thi có 25 câu trắc nghiệm, làm đúng được 4 điểm, làm sai bị trừ 1 điểm (làm hết 25 câu). Để đạt ít nhất 60 điểm thì phải làm đúng ít nhất", "opts": ["16 câu", "17 câu", "18 câu", "15 câu"], "ans": 1, "sol": "Làm đúng x câu: 4x − (25 − x) ≥ 60 ⇒ 5x ≥ 85 ⇒ x ≥ 17.", "t": "DS3"}, {"q": "Giá trị của biểu thức $\\dfrac{1}{\\sqrt{2}+1} + \\dfrac{1}{\\sqrt{3}+\\sqrt{2}} + \\dfrac{1}{2+\\sqrt{3}}$ là", "opts": ["3", "$\\sqrt{3}$", "2", "1"], "ans": 3, "sol": "Trục căn từng số hạng: (√2 − 1) + (√3 − √2) + (2 − √3) = 1.", "t": "DS5"}, {"q": "Mái một nhà kho có dạng tam giác cân với đáy 12 m, hai mái dốc đều nghiêng 30° so với phương ngang. Chiều dài mỗi mái dốc là", "opts": ["6 m", "$2\\sqrt{3}$ m", "$4\\sqrt{3}$ m", "12 m"], "ans": 2, "sol": "Nửa đáy là 6 m; mỗi mái là cạnh huyền có góc kề 30°: dài = 6 : cos 30° = 6 : (√3/2) = 4√3 (m).", "t": "HH1"}, {"q": "Kim phút của một chiếc đồng hồ dài 12 cm. Trong 25 phút đầu kể từ lúc 12 giờ đúng, đầu kim phút vạch nên cung tròn dài", "opts": ["5π cm", "10π cm", "20π cm", "25π cm"], "ans": 1, "sol": "25 phút ứng với góc 25 · 6° = 150°. Độ dài cung = π · 12 · 150 : 180 = 10π (cm).", "t": "HH2"}, {"q": "Cho đường tròn (O; R) và điểm M ngoài đường tròn; hai tiếp tuyến MA, MB tạo với nhau góc 60° và OM = 10 cm. Bán kính R bằng", "opts": ["5 cm", "$5\\sqrt{3}$ cm", "10 cm", "20 cm"], "ans": 0, "sol": "OM là phân giác nên $\\widehat{AMO}$ = 30°. Tam giác OAM vuông tại A: R = OA = OM · sin 30° = 5 (cm).", "t": "HH3"}], "ds": [{"q": "Bạn Lan có 250 000 đồng. Lan mua một chiếc túi giá 40 000 đồng và x ki-lô-gam gạo giá 18 000 đồng/kg (x nguyên dương). Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "Số tiền Lan phải trả là 40 000 + 18 000x (đồng).", "ans": true, "sol": "Tiền túi cộng tiền x kg gạo: 40 000 + 18 000x.", "tp": "DS3"}, {"t": "Điều kiện để Lan đủ tiền là 40 000 + 18 000x ≥ 250 000.", "ans": false, "sol": "Lan đủ tiền khi số tiền phải trả không vượt quá số tiền có: 40 000 + 18 000x ≤ 250 000.", "tp": "DS3"}, {"t": "Lan mua được nhiều nhất 11 kg gạo.", "ans": true, "sol": "18 000x ≤ 210 000 ⇒ x ≤ 11,67…; x nguyên nên x lớn nhất là 11.", "tp": "DS3"}, {"t": "Nếu Lan mua 10 kg gạo thì còn dư 30 000 đồng.", "ans": true, "sol": "Số tiền phải trả: 40 000 + 180 000 = 220 000 (đồng); còn dư 250 000 − 220 000 = 30 000 (đồng).", "tp": "DS3"}]}, {"q": "Một chiếc quạt giấy khi xòe ra có dạng phần hình vành khuyên: hình quạt tròn lớn bán kính 20 cm bị cắt bỏ hình quạt tròn nhỏ bán kính 8 cm cùng góc ở tâm 150°. Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "Cung ngoài và cung trong của quạt đều có số đo 150°.", "ans": true, "sol": "Hai cung chắn cùng góc ở tâm 150° nên có cùng số đo 150°.", "tp": "HH2"}, {"t": "Độ dài cung ngoài của quạt bằng 50π cm.", "ans": false, "sol": "l = π · 20 · 150 : 180 = $\\dfrac{50\\pi }{3}$ (cm), không phải 50π cm.", "tp": "HH2"}, {"t": "Diện tích hình quạt tròn lớn (bán kính 20 cm) bằng $\\dfrac{250\\pi }{3}$ cm².", "ans": false, "sol": "S = π · 2$0^{2}$ · 150 : 360 = $\\dfrac{500\\pi }{3}$ (cm²), không phải $\\dfrac{250\\pi }{3}$ cm².", "tp": "HH2"}, {"t": "Diện tích phần giấy của quạt bằng 140π cm².", "ans": true, "sol": "Diện tích hình quạt lớn trừ diện tích hình quạt nhỏ: $\\dfrac{500\\pi }{3} - \\dfrac{5\\pi \\cdot 64}{12}$ = π(400 − 64) · 150 : 360 = 140π (cm²).", "tp": "HH2"}]}], "tln": [{"q": "Một thùng hình lập phương không nắp có thể tích 512 dm³. Tính diện tích bìa cứng cần dùng để làm thùng (đơn vị: dm², coi diện tích các mép nối là không đáng kể).", "ans": "320", "sol": "Cạnh thùng = ∛512 = 8 dm. Thùng có 5 mặt (4 mặt bên và 1 đáy) nên diện tích là 5 · $8^{2}$ = 320 (dm²).", "t": "DS4"}, {"q": "An mua 3 cái bút và 2 quyển vở hết 41 000 đồng. Bình mua 2 cái bút và 3 quyển vở cùng loại hết 44 000 đồng. Tính giá một quyển vở (đơn vị: nghìn đồng).", "ans": "10", "sol": "Gọi giá một bút là x, một vở là y (nghìn đồng): 3x + 2y = 41 và 2x + 3y = 44. Lấy 3·(phương trình 1) − 2·(phương trình 2): 5x = 35 ⇒ x = 7; suy ra y = 10.", "t": "DS2"}, {"q": "Một cây bị gãy: điểm gãy cách gốc cây 4 m, đoạn thân gãy (nối điểm gãy với ngọn đang chạm đất) tạo với mặt đất một góc 30°. Tính chiều cao của cây trước khi gãy (đơn vị: m).", "ans": "12", "sol": "Gọi A là gốc, B là điểm gãy, C là ngọn chạm đất: tam giác ABC vuông tại A, AB = 4 m, $\\widehat{C}$ = 30°. BC = AB : sin 30° = 4 : (1/2) = 8 m. Chiều cao ban đầu của cây là AB + BC = 4 + 8 = 12 m.", "t": "HH1"}, {"q": "Cho đường tròn (O; 6 cm). Hai tiếp tuyến MA, MB của đường tròn cắt nhau tại M và $\\widehat{AOB}$ = 120°. Tính độ dài OM (đơn vị: cm).", "ans": "12", "sol": "OM là tia phân giác của $\\widehat{AOB}$ nên $\\widehat{AOM}$ = 60°. Tam giác OAM vuông tại A (MA ⊥ OA) có OA = OM · cos 60° nên OM = 6 : (1/2) = 12 cm.", "t": "HH3"}]}, {"nlc": [{"q": "Tập nghiệm của phương trình x(2x + 1) = 0 là", "opts": ["x = 0 hoặc x = $\\dfrac{1}{2}$", "x = 0 hoặc x = −2", "x = 0 hoặc x = 2", "x = 0 hoặc x = $-\\dfrac{1}{2}$"], "ans": 3, "sol": "x = 0 hoặc 2x + 1 = 0 ⇒ x = −1/2.", "t": "DS1"}, {"q": "Cặp số (x; y) là nghiệm của hệ phương trình $\\begin{cases}x - 2y = 3\\\\ 3x + y = 2\\end{cases}$ là", "opts": ["(−1; 1)", "(1; −1)", "(1; 1)", "(2; −1)"], "ans": 1, "sol": "Từ phương trình thứ hai y = 2 − 3x; thế vào phương trình đầu: x − 2(2 − 3x) = 3 ⇒ 7x = 7 ⇒ x = 1, y = −1.", "t": "DS2"}, {"q": "Bất phương trình $(x + 3)^{2} - x^{2} \\le  4x + 15$ có nghiệm là", "opts": ["x ≥ 3", "x ≤ −3", "x ≤ 3", "x < 3"], "ans": 2, "sol": "Khai triển: x² + 6x + 9 − x² ≤ 4x + 15 ⇒ 2x ≤ 6 ⇒ x ≤ 3.", "t": "DS3"}, {"q": "Giá trị của biểu thức $\\sqrt{25} + \\sqrt[3]{-8}$ là", "opts": ["3", "7", "1", "−3"], "ans": 0, "sol": "√25 = 5; ∛(−8) = −2. Tổng: 5 + (−2) = 3.", "t": "DS4"}, {"q": "Giá trị của biểu thức $\\sqrt[3]{-27} + \\sqrt[3]{125}$ là", "opts": ["8", "−8", "2", "−2"], "ans": 2, "sol": "∛(−27) = −3; ∛125 = 5. Tổng: 2.", "t": "DS4"}, {"q": "Giá trị của biểu thức $(\\sqrt{12} - \\sqrt{3})^{2}$ là", "opts": ["9", "3", "27", "15"], "ans": 1, "sol": "√12 − √3 = 2√3 − √3 = √3 nên bình phương bằng 3.", "t": "DS5"}, {"q": "Giá trị của biểu thức $\\sqrt{7 + 4\\sqrt{3}} + \\sqrt{7 - 4\\sqrt{3}}$ là", "opts": ["4", "$4\\sqrt{3}$", "$2\\sqrt{3}$", "2"], "ans": 0, "sol": "7 ± 4√3 = (2 ± √3)². Vậy tổng = (2 + √3) + (2 − √3) = 4.", "t": "DS5"}, {"q": "Cho tam giác MNP vuông tại M. Khi đó sin N bằng", "opts": ["$\\dfrac{MN}{NP}$", "$\\dfrac{MP}{MN}$", "$\\dfrac{MN}{MP}$", "$\\dfrac{MP}{NP}$"], "ans": 3, "sol": "sin N = cạnh đối : cạnh huyền = MP : NP.", "t": "HH1"}, {"q": "Cho đường tròn (O), cung nhỏ AB có số đo 130°. Số đo góc ở tâm chắn cung AB là", "opts": ["65°", "230°", "260°", "130°"], "ans": 3, "sol": "Số đo góc ở tâm bằng số đo cung bị chắn: 130°.", "t": "HH2"}, {"q": "Độ dài cung 90° của đường tròn bán kính 8 cm là", "opts": ["2π cm", "8π cm", "4π cm", "16π cm"], "ans": 2, "sol": "l = π · 8 · 90 : 180 = 4π (cm).", "t": "HH2"}, {"q": "Hai đường tròn (O; 6 cm) và (O′; 4 cm) cắt nhau tại hai điểm phân biệt khi độ dài OO′ bằng", "opts": ["5 cm", "2 cm", "10 cm", "12 cm"], "ans": 0, "sol": "Hai đường tròn cắt nhau khi R − r < OO′ < R + r, tức 2 < OO′ < 10. Chỉ có 5 cm thỏa mãn.", "t": "HH2"}, {"q": "Cho đường tròn (O; 5 cm) và dây AB = 6 cm. Khoảng cách từ O đến dây AB bằng", "opts": ["3 cm", "4 cm", "2 cm", "8 cm"], "ans": 1, "sol": "Gọi H là trung điểm AB thì OH ⊥ AB, AH = 3; OH = √(5² − 3²) = 4 (cm).", "t": "HH3"}], "nlcx": [{"q": "Một ca nô xuôi dòng 2 giờ được 48 km và ngược dòng 3 giờ được 54 km. Vận tốc dòng nước là", "opts": ["6 km/h", "9 km/h", "3 km/h", "2 km/h"], "ans": 2, "sol": "Gọi vận tốc riêng ca nô là v, vận tốc dòng nước là w: v + w = 48 : 2 = 24 và v − w = 54 : 3 = 18. Suy ra w = 3 (km/h).", "t": "DS2"}, {"q": "Công ty cần mua máy: máy A giá 4 triệu đồng, tiền điện 0,3 triệu đồng/tháng; máy B giá 3 triệu đồng, tiền điện 0,5 triệu đồng/tháng. Dùng ít nhất bao nhiêu tháng (số nguyên) thì tổng chi phí của máy A ít hơn máy B?", "opts": ["5 tháng", "7 tháng", "4 tháng", "6 tháng"], "ans": 3, "sol": "Sau x tháng: 4 + 0,3x < 3 + 0,5x ⇒ 0,2x > 1 ⇒ x > 5. Vậy x nguyên nhỏ nhất là 6.", "t": "DS3"}, {"q": "Giá trị của biểu thức $\\dfrac{\\sqrt{5}+2}{\\sqrt{5}-2} + \\dfrac{\\sqrt{5}-2}{\\sqrt{5}+2}$ là", "opts": ["18", "$2\\sqrt{5}$", "9", "10"], "ans": 0, "sol": "Quy đồng, mẫu chung (√5 − 2)(√5 + 2) = 1; tử: (√5 + 2)² + (√5 − 2)² = 2(5 + 4) = 18.", "t": "DS5"}, {"q": "Một cái cây có bóng trên mặt đất dài 10 m khi tia nắng tạo với mặt đất góc 60°. Chiều cao của cây là", "opts": ["20 m", "$10\\sqrt{3}$ m", "10 m", "$5\\sqrt{3}$ m"], "ans": 1, "sol": "Chiều cao = bóng · tan 60° = 10√3 (m).", "t": "HH1"}, {"q": "Quanh một sân tròn bán kính 20 m có một hồ nước tròn đồng tâm bán kính 12 m. Diện tích phần sân không có nước là", "opts": ["64π m²", "32π m²", "256π m²", "544π m²"], "ans": 2, "sol": "S = π(20² − 12²) = π(400 − 144) = 256π (m²).", "t": "HH2"}, {"q": "Từ điểm M ngoài đường tròn (O; 6 cm) kẻ hai tiếp tuyến MA, MB. Biết MA = 8 cm. Độ dài dây AB là", "opts": ["4,8 cm", "12 cm", "9 cm", "9,6 cm"], "ans": 3, "sol": "OM = √(6² + 8²) = 10. Gọi H là giao điểm OM và AB: AH · OM = OA · MA ⇒ AH = 6 · 8 : 10 = 4,8; AB = 2AH = 9,6 (cm).", "t": "HH3"}], "ds": [{"q": "Cho hai biểu thức $A = \\sqrt{5 + 2\\sqrt{6}}$ và $B = \\sqrt{5 - 2\\sqrt{6}}$. Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "A = $\\sqrt{3} + \\sqrt{2}$.", "ans": true, "sol": "(√3 + √2)² = 3 + 2 + 2√6 = 5 + 2√6 nên A = √3 + √2.", "tp": "DS5"}, {"t": "A − B = $2\\sqrt{3}$.", "ans": false, "sol": "B = √3 − √2 nên A − B = 2√2, không phải 2√3.", "tp": "DS5"}, {"t": "AB = 1.", "ans": true, "sol": "AB = (√3 + √2)(√3 − √2) = 3 − 2 = 1.", "tp": "DS5"}, {"t": "Giá trị của $\\dfrac{1}{A}$ bằng B.", "ans": true, "sol": "Vì AB = 1 nên 1/A = B.", "tp": "DS5"}]}, {"q": "Cho tam giác ABC vuông tại A có AB = 6 cm, AC = 8 cm; AH là đường cao. Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "BC = 10 cm.", "ans": true, "sol": "BC² = 6² + 8² = 100 ⇒ BC = 10 cm.", "tp": "HH1"}, {"t": "cos B = $\\dfrac{4}{5}$.", "ans": false, "sol": "cos B = AB : BC = 6 : 10 = $\\dfrac{3}{5}$, không phải $\\dfrac{4}{5}$.", "tp": "HH1"}, {"t": "AH = 4,8 cm.", "ans": true, "sol": "AH · BC = AB · AC ⇒ AH = 6 · 8 : 10 = 4,8 (cm).", "tp": "HH1"}, {"t": "Đường tròn (A; 5 cm) cắt đường thẳng BC tại hai điểm phân biệt.", "ans": true, "sol": "Khoảng cách từ A đến BC là AH = 4,8 cm < 5 cm nên đường thẳng BC cắt đường tròn (A; 5 cm) tại hai điểm phân biệt.", "tp": "HH3"}]}], "tln": [{"q": "Tính giá trị của biểu thức $\\dfrac{\\sqrt{18}}{\\sqrt{2}} + \\sqrt[3]{-64}$.", "ans": "−1", "sol": "√18 : √2 = √9 = 3; ∛(−64) = −4. Kết quả: 3 − 4 = −1.", "t": "DS4"}, {"q": "Cho hệ phương trình $\\begin{cases}3x - 2y = 8\\\\ x + 4y = 5\\end{cases}$. Gọi (x; y) là nghiệm của hệ, tính tích xy.", "ans": "1,5", "sol": "Nhân phương trình đầu với 2 rồi cộng với phương trình sau: 7x = 21 ⇒ x = 3; y = 0,5. Vậy xy = 1,5.", "t": "DS2"}, {"q": "Cho tam giác ABC vuông tại A, đường cao AH = 4 cm và góc B bằng 45°. Tính diện tích tam giác ABC (đơn vị: cm²).", "ans": "16", "sol": "Tam giác ABC vuông cân tại A nên H là trung điểm BC và BC = 2AH = 8 cm. Diện tích = BC · AH : 2 = 8 · 4 : 2 = 16 (cm²).", "t": "HH1"}, {"q": "Cho đường thẳng d cách tâm O của đường tròn (O; R) một khoảng 5 cm và cắt đường tròn tại hai điểm A, B với AB = 24 cm. Tính bán kính R (đơn vị: cm).", "ans": "13", "sol": "Gọi H là chân đường vuông góc kẻ từ O đến d thì H là trung điểm AB, AH = 12. R = OA = √(5² + 12²) = 13 (cm).", "t": "HH3"}]}, {"nlc": [{"q": "Phương trình (x + 2)(3x − 9) = 0 có tập nghiệm là", "opts": ["x = −2 hoặc x = 3", "x = 2 hoặc x = 3", "x = −2 hoặc x = −3", "x = 2 hoặc x = −3"], "ans": 0, "sol": "x + 2 = 0 ⇒ x = −2; 3x − 9 = 0 ⇒ x = 3.", "t": "DS1"}, {"q": "Nghiệm (x; y) của hệ phương trình $\\begin{cases}x + y = 5\\\\ 2x - y = 1\\end{cases}$ là", "opts": ["(3; 2)", "(1; 4)", "(−2; 7)", "(2; 3)"], "ans": 3, "sol": "Cộng hai phương trình: 3x = 6 ⇒ x = 2, y = 3.", "t": "DS2"}, {"q": "Cho a < b. Khẳng định nào sau đây đúng?", "opts": ["−2a + 3 < −2b + 3", "−2a + 3 > −2b + 3", "2a − 3 > 2b − 3", "a + 3 > b + 3"], "ans": 1, "sol": "Nhân hai vế của a < b với −2 (số âm) được −2a > −2b, rồi cộng 3: −2a + 3 > −2b + 3.", "t": "DS3"}, {"q": "Giá trị của $\\sqrt{(-6)^{2}}$ là", "opts": ["−6", "36", "6", "±6"], "ans": 2, "sol": "√((−6)²) = |−6| = 6.", "t": "DS4"}, {"q": "Giá trị của biểu thức $\\sqrt[3]{1000} - \\sqrt[3]{-1}$ là", "opts": ["11", "9", "−11", "−9"], "ans": 0, "sol": "∛1000 = 10; ∛(−1) = −1. Hiệu: 10 − (−1) = 11.", "t": "DS4"}, {"q": "Với x < 3, biểu thức $\\sqrt{x^{2} - 6x + 9}$ bằng", "opts": ["x − 3", "x + 3", "−x − 3", "3 − x"], "ans": 3, "sol": "√(x² − 6x + 9) = √((x − 3)²) = |x − 3|. Vì x < 3 nên |x − 3| = 3 − x.", "t": "DS5"}, {"q": "Giá trị của biểu thức $\\dfrac{\\sqrt{3}+\\sqrt{2}}{\\sqrt{3}-\\sqrt{2}} - \\dfrac{\\sqrt{3}-\\sqrt{2}}{\\sqrt{3}+\\sqrt{2}}$ là", "opts": ["$2\\sqrt{6}$", "4", "$4\\sqrt{6}$", "10"], "ans": 2, "sol": "Quy đồng, mẫu chung (√3 − √2)(√3 + √2) = 1; tử: (√3 + √2)² − (√3 − √2)² = 4√6.", "t": "DS5"}, {"q": "Cho tam giác ABC vuông tại A có góc B bằng 30°. Khi đó AC bằng", "opts": ["$\\dfrac{BC}{\\sqrt{3}}$", "$\\dfrac{BC}{2}$", "$BC\\sqrt{3}$", "2BC"], "ans": 1, "sol": "AC = BC · sin 30° = BC : 2.", "t": "HH1"}, {"q": "Phát biểu nào sau đây đúng?", "opts": ["Đường tròn có đúng một trục đối xứng", "Đường tròn có vô số trục đối xứng", "Đường tròn có đúng hai trục đối xứng", "Đường tròn không có trục đối xứng"], "ans": 1, "sol": "Mỗi đường thẳng đi qua tâm là một trục đối xứng của đường tròn nên có vô số trục đối xứng.", "t": "HH2"}, {"q": "Cho đường tròn (O; 5 cm) và dây AB = 8 cm. Khoảng cách từ O đến AB bằng", "opts": ["4 cm", "6 cm", "2 cm", "3 cm"], "ans": 3, "sol": "Gọi H là trung điểm AB thì OH ⊥ AB, AH = 4; OH = √(25 − 16) = 3 (cm).", "t": "HH2"}, {"q": "Hai đường tròn (O; 5 cm) và (O′; 3 cm) có OO′ = 9 cm. Vị trí tương đối của hai đường tròn là", "opts": ["tiếp xúc ngoài", "cắt nhau", "ở ngoài nhau", "đựng nhau"], "ans": 2, "sol": "OO′ = 9 > 5 + 3 = 8 nên hai đường tròn ở ngoài nhau.", "t": "HH2"}, {"q": "Từ điểm M ngoài đường tròn (O; 3 cm) kẻ hai tiếp tuyến MA, MB vuông góc với nhau (A, B là tiếp điểm). Khi đó OM bằng", "opts": ["$3\\sqrt{2}$ cm", "3 cm", "$3\\sqrt{3}$ cm", "6 cm"], "ans": 0, "sol": "Tứ giác OAMB có ba góc vuông và OA = OB nên là hình vuông cạnh 3; OM là đường chéo: OM = 3√2 (cm).", "t": "HH3"}], "nlcx": [{"q": "Tháng đầu hai tổ làm được 900 sản phẩm. Sang tháng sau tổ 1 làm vượt 15%, tổ 2 làm vượt 12% nên cả hai tổ làm được 1 011 sản phẩm. Tháng đầu, tổ 1 làm được", "opts": ["800 sản phẩm", "100 sản phẩm", "150 sản phẩm", "200 sản phẩm"], "ans": 1, "sol": "Gọi x, y là số sản phẩm tháng đầu của tổ 1, tổ 2: x + y = 900 và 1,15x + 1,12y = 1 011. Thế y = 900 − x: 0,03x = 3 ⇒ x = 100.", "t": "DS2"}, {"q": "Một xe tải có tải trọng tối đa 5 000 kg. Tài xế và phụ xe nặng tổng cộng 150 kg, mỗi thùng hàng nặng 25 kg. Xe chở được nhiều nhất bao nhiêu thùng hàng?", "opts": ["195 thùng", "193 thùng", "194 thùng", "200 thùng"], "ans": 2, "sol": "25x + 150 ≤ 5 000 ⇒ x ≤ 194. Vậy tối đa 194 thùng.", "t": "DS3"}, {"q": "Cho $x = \\sqrt{4 + 2\\sqrt{3}}$ và $y = \\sqrt{4 - 2\\sqrt{3}}$. Giá trị của $x^{2} + y^{2}$ là", "opts": ["8", "6", "4", "$2\\sqrt{3}$"], "ans": 0, "sol": "x² + y² = (4 + 2√3) + (4 − 2√3) = 8.", "t": "DS5"}, {"q": "Một máy bay đang ở độ cao 3 000 m hạ cánh theo đường thẳng tạo với mặt đất góc 30°. Quãng đường máy bay bay tới mặt đất là", "opts": ["1 500 m", "6 000 m", "$3 000\\sqrt{3}$ m", "3 000 m"], "ans": 1, "sol": "Quãng đường = 3 000 : sin 30° = 6 000 (m).", "t": "HH1"}, {"q": "Một cánh quạt hình quạt tròn bán kính 6 cm có diện tích 12π cm². Số đo góc ở tâm của hình quạt là", "opts": ["60°", "90°", "240°", "120°"], "ans": 3, "sol": "S = π · 6² · n : 360 = 12π ⇒ n = 120.", "t": "HH2"}, {"q": "Hai tiếp tuyến MA, MB của đường tròn (O; R) tạo với nhau góc 60° và MA = $3\\sqrt{3}$ cm. Bán kính R bằng", "opts": ["$3\\sqrt{3}$ cm", "6 cm", "3 cm", "9 cm"], "ans": 2, "sol": "OM là phân giác nên $\\widehat{AMO}$ = 30°. Tam giác OAM vuông tại A: R = OA = MA · tan 30° = 3√3 · (1/√3) = 3 (cm).", "t": "HH3"}], "ds": [{"q": "Cho hai số $x = \\dfrac{2}{\\sqrt{3} - 1}$ và $y = \\dfrac{2}{\\sqrt{3} + 1}$. Xét tính đúng – sai của mỗi khẳng định  {"q": "Cho đường tròn (O; 5 cm) và dây AB = 6 cm. Các tiếp tuyến của đường tròn tại A và B cắt nhau tại M. Tính độ dài MA (đơn vị: cm).", "ans": "3,75", "sol": "Gọi H là trung điểm AB: OH = √(25 − 9) = 4, AH = 3. Trong tam giác OAM vuông tại A, đường cao AH: AH² = OH · HM ⇒ HM = 9 : 4 = 2,25. MA² = AH² + HM² = 9 + 5,0625 ⇒ MA = 3,75 (cm).", "t": "HH3"}]}, {"nlc": [{"q": "Bạn An giải phương trình (x − 1)(x + 3) = 0 và viết: “x = 1 hoặc x = 3”. Nghiệm đúng của phương trình là", "opts": ["x = −1 hoặc x = 3", "x = 1 hoặc x = −3", "x = −1 hoặc x = −3", "x = 1 hoặc x = 3"], "ans": 1, "sol": "x − 1 = 0 ⇒ x = 1; x + 3 = 0 ⇒ x = −3. Bạn An sai ở nghiệm của x + 3 = 0.", "t": "DS1"}, {"q": "Hệ phương trình $\\begin{cases}x + 2y = 4\\\\ 2x + 4y = 8\\end{cases}$", "opts": ["có vô số nghiệm", "có nghiệm duy nhất (4; 0)", "vô nghiệm", "có đúng hai nghiệm"], "ans": 0, "sol": "Phương trình thứ hai bằng hai lần phương trình thứ nhất nên hai phương trình trùng nhau, hệ có vô số nghiệm.", "t": "DS2"}, {"q": "Số nguyên dương x thỏa mãn bất phương trình 2x − 7 < 5 là", "opts": ["4 số", "6 số", "5 số", "7 số"], "ans": 2, "sol": "2x < 12 ⇒ x < 6. Số nguyên dương x thỏa mãn: 1, 2, 3, 4, 5, có 5 số.", "t": "DS3"}, {"q": "Khẳng định nào sau đây sai?", "opts": ["$\\sqrt[3]{-8} = -2$", "$\\sqrt{9} = 3$", "$\\sqrt[3]{27} = 3$", "$\\sqrt{(-4)^{2}} = -4$"], "ans": 3, "sol": "√((−4)²) = √16 = 4 chứ không bằng −4 nên khẳng định ở phương án này sai.", "t": "DS4"}, {"q": "Giá trị của $\\sqrt[3]{0,125}$ là", "opts": ["0,05", "0,25", "5", "0,5"], "ans": 3, "sol": "0,5³ = 0,125 nên ∛0,125 = 0,5.", "t": "DS4"}, {"q": "Điều kiện xác định của biểu thức $\\dfrac{\\sqrt{x+3}}{x-1}$ là", "opts": ["x ≥ −3 và x ≠ 1", "x > −3 và x ≠ 1", "x ≥ −3", "x ≠ 1"], "ans": 0, "sol": "Căn có nghĩa khi x + 3 ≥ 0 ⇒ x ≥ −3; mẫu khác 0 khi x ≠ 1.", "t": "DS5"}, {"q": "Giá trị của biểu thức $\\sqrt{11 - 6\\sqrt{2}}$ là", "opts": ["$3 + \\sqrt{2}$", "$3 - \\sqrt{2}$", "$\\sqrt{2} - 3$", "$\\sqrt{5}$"], "ans": 1, "sol": "11 − 6√2 24 tuần", "30 tuần", "23 tuần"], "ans": 3, "sol": "150 + 20x ≥ 600 ⇒ x ≥ 22,5. Vậy x nguyên nhỏ nhất là 23.", "t": "DS3"}, {"q": "Giá trị của biểu thức $\\sqrt{13 + 4\\sqrt{3}} + \\sqrt{13 - 4\\sqrt{3}}$ là", "opts": ["$2\\sqrt{3}$", "$4\\sqrt{3}$", "4", "26"], "ans": 1, "sol": "13 ± 4√3 = (2√3 ± 1)². Tổng = (2√3 + 1) + (2√3 − 1) = 4√3.", "t": "DS5"}, {"q": "Một con diều thả dây dài 80 m; dây căng thẳng và tạo với phương ngang góc 30°. Độ cao của con diều so với tay người thả là", "opts": ["$40\\sqrt{3}$ m", "80 m", "40 m", "20 m"], "ans": 2, "sol": "Độ cao = 80 · sin 30° = 40 (m).", "t": "HH1"}, {"q": "Hai đường tròn (O; R) và (O′; r) tiếp xúc ngoài, OO′ = 12 cm và R − r = 2 cm. Bán kính R bằng", "opts": ["5 cm", "10 cm", "14 cm", "7 cm"], "ans": 3, "sol": "Tiếp xúc ngoài: R + r = 12; cùng R − r = 2 ⇒ R = 7 (cm).", "t": "HH2"}, {"q": "Từ điểm M cách tâm O của đường tròn (O; 8 cm) một khoảng 17 cm kẻ tiếp tuyến MA. Chu vi tam giác OAM là", "opts": ["40 cm", "25 cm", "32 cm", "20 cm"], "ans": 0, "sol": "MA = √(17² − 8²) = 15. Chu vi = 8 + 15 + 17 = 40 (cm).", "t": "HH3"}], "ds": [{"q": "Cho phương trình ẩn x: (x − 1)(x + 2) = (m + 4)(x + 2) (m là tham số). Xét tính đúng – sai của mỗi khẳng định sau.", "parts": [{"t": "x = −2 là một nghiệm của phương trình với mọi giá trị của m.", "ans": true, "sol": "Thay x = −2: hai vế cùng bằng 0 nên x = −2 luôn là nghiệm.", "tp": "DS1"}, {"t": "Với m = 0, phương trình có nghiệm duy nhất.", "ans": false, "sol": "Với m = 0: (x + 2)(x − 5) = 0 ⇒ x = −2 hoặc x = 5, có hai nghiệm.", "tp": "DS1"}, {"t": "Phương trình còn có nghiệm x = m + 5.", "ans": true, "sol": "Chuyển vế: (x + 2)(x − 1 − m − 4) = 0 ⇒ (x + 2)(x − m − 5) = 0 nên có nghiệm x = m + 5.", "tp": "DS1"}, {"t": "Có giá trị của m để phương trình có ba nghiệm phân biệt.", "ans": false, "sol": "Phương trình tích có hai nhân tử bậc nhất nên có nhiều nhất hai nghiệm, không thể có ba nghiệm.", "tp": "DS1"}]}, {"q": "Cho đường tròn (O) đường kính BC; A là một điểm thuộc đường tròn ( ao AH = AB · AC : BC = 3 · 4 : 5 = 2,4 (cm).", "t": "HH3"}]}];

function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function targets(n,r){const base=[];for(let i=0;i<n;i++)base.push(i%4);let t;for(let k=0;k<200;k++){t=shuf(base,r);let ok=true;for(let i=2;i<n;i++)if(t[i]==t[i-1]&&t[i]==t[i-2])ok=false;if(ok)return t}return t}
function mixOpts(list,r){const tg=targets(list.length,r);return list.map((q,i)=>{const wrong=shuf(q.opts.map((o,k)=>k).filter(k=>k!=q.ans),r);const opts=[];let w=0;for(let p=0;p<4;p++)opts.push(p==tg[i]?q.opts[q.ans]:q.opts[wrong[w++]]);return Object.assign({},q,{opts,ans:tg[i]})})}
function buildExam(m,seed){
  const r=mul(seed);
  let a=[...Array(12)].map((_,i)=>SRC[(i+m)%N].nlc[i]);
  let b=[...Array(6)].map((_,j)=>SRC[(j+m)%N].nlcx[j]);
  const ds=[SRC[m%N].ds[0],SRC[(m+1)%N].ds[1]];
  let t=[...Array(4)].map((_,j)=>SRC[(j+m)%N].tln[j]);
  return {m,seed,nlc:mixOpts(shuf(a,r),r),nlcx:mixOpts(shuf(b,r),r),ds,tln:shuf(t,r)};
}
function numval(s){s=String(s).trim().toLowerCase().replace(/\s+/g,"").replace(/[−–—]/g,"-").replace(/,/g,".").replace(/(cm²|cm2|dm²|m²|cm|dm|km\/h|km|m|%|đ|đồng|nghìn|usd|độ|°)+$/,"");
 if(!s)return NaN;s=s.replace(/π|pi/g,"P").replace(/(\d)P/g,"$1*P").replace(/P(\d)/g,"P*$1");
 if(!/^[0-9.+\-*\/()P]+$/.test(s))return NaN;try{const v=Function("P","return ("+s+")")(Math.PI);return typeof v=="number"&&isFinite(v)?v:NaN}catch(e){return NaN}}
function tlnOK(inp,ans){const x=numval(inp),y=numval(ans);return !isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<1e-6*Math.max(1,Math.abs(y))}
function score(ex,A){
  let s1=0,s2=0,s3=0,s4=0,wrong=[],blank=[];
  ex.nlc.forEach((q,i)=>{if(A.nlc[i]==null)blank.push("I."+(i+1));else if(A.nlc[i]==q.ans)s1+=.25;else wrong.push("I."+(i+1)+"["+q.t+"]")});
  ex.nlcx.forEach((q,i)=>{if(A.nlcx[i]==null)blank.push("II."+(i+1));else if(A.nlcx[i]==q.ans)s2+=.5;else wrong.push("II."+(i+1)+"["+q.t+"]")});
  ex.ds.forEach((c,i)=>c.parts.forEach((p,k)=>{const v=A.ds[i][k];if(v==null)blank.push("III."+(i+1)+"abcd"[k]);else if(v===p.ans)s3+=.25;else wrong.push("III."+(i+1)+"abcd"[k]+"["+p.tp+"]")}));
  ex.tln.forEach((q,i)=>{const v=(A.tln[i]||"").trim();if(!v)blank.push("IV."+(i+1));else if(tlnOK(v,q.ans))s4+=.5;else wrong.push("IV."+(i+1)+"["+q.t+"]")});
  return {s1,s2,s3,s4,total:s1+s2+s3+s4,wrong,blank};
}
function fresh(ex){return{nlc:Array(12).fill(null),nlcx:Array(6).fill(null),ds:[Array(4).fill(null),Array(4).fill(null)],tln:Array(4).fill("")}}
let ST=null,timer=null;
const f2=x=>(Math.round(x*100)/100).toString().replace(".",",");
function render(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false})}
function save(){try{localStorage.setItem("t9ontap",JSON.stringify({m:ST.ex.m,seed:ST.ex.seed,A:ST.A,t0:ST.t0,name:$("#nm").value,cls:$("#cl").value,done:ST.done,use:ST.use}))}catch(e){}}
function count(){let n=0;ST.A.nlc.forEach(v=>v!=null&&n++);ST.A.nlcx.forEach(v=>v!=null&&n++);ST.A.ds.forEach(a=>a.forEach(v=>v!=null&&n++));ST.A.tln.forEach(v=>v.trim()&&n++);return n}
function upd(){const n=count();$("#pc").textContent=n+"/30";$("#prog i").style.width=(n/30*100)+"%";save()}
function ask(msg){return new Promise(res=>{const o=div("ov"),b=div("card mdl");b.appendChild(div("",msg));const r=div("row");r.style.marginTop="12px";const y=document.createElement("button");y.className="pri";y.textContent="Đồng ý";const n=document.createElement("button");n.textContent="Hủy";const done=v=>{o.remove();res(v)};y.onclick=()=>done(true);n.onclick=()=>done(false);r.append(y,n);b.appendChild(r);o.appendChild(b);document.body.appendChild(o);y.focus()})}
function div(c,t){const d=document.createElement("div");if(c)d.className=c;if(t!=null)d.textContent=t;return d}
function head(i,txt,w){const d=div("qt");d.appendChild(document.createTextNode("Câu "+(i+1)+". "+txt+" "));const s=document.createElement("small");s.textContent="("+w+" đ)";d.appendChild(s);return d}
function mcBlock(par,list,key,w,label){
  list.forEach((q,i)=>{const b=div("q");b.appendChild(head(i,q.q,w));
    q.opts.forEach((o,k)=>{const bt=document.createElement("button");bt.className="opt";bt.dataset.k=k;bt.textContent=L[k]+". "+o;
      bt.onclick=()=>{if(ST.done)return;ST.A[key][i]=(ST.A[key][i]===k?null:k);[...b.querySelectorAll(".opt")].forEach(x=>x.classList.toggle("sel",+x.dataset.k===ST.A[key][i]));upd()};b.appendChild(bt)});
    par.appendChild(b)})
}
function paper(){
  const P=$("#paper");P.innerHTML="";const ex=ST.ex;
  P.appendChild(Object.assign(document.createElement("h2"),{textContent:"Phần I. Nhiều phương án lựa chọn (3,0 điểm – mỗi câu 0,25)"}));
  let sec=div("card");mcBlock(sec,ex.nlc,"nlc",0.25);P.appendChild(sec);
  P.appendChild(Object.assign(document.createElement("h2"),{textContent:"Phần II. Nhiều phương án lựa chọn – vận dụng (3,0 điểm – mỗi câu 0,5)"}));
  sec=div("card");mcBlock(sec,ex.nlcx,"nlcx",0.5);P.appendChild(sec);
  P.appendChild(Object.assign(document.createElement("h2"),{textContent:"Phần III. Đúng – sai (2,0 điểm – mỗi ý 0,25)"}));
  sec=div("card");
  ex.ds.forEach((c,i)=>{const b=div("q");b.appendChild(div("qt","Câu "+(i+1)+". "+c.q));
    c.parts.forEach((p,k)=>{const row=div("part");row.appendChild(div("",("abcd"[k])+") "+p.t));
      [["Đúng",true],["Sai",false]].forEach(([lb,val])=>{const bt=document.createElement("button");bt.textContent=lb;bt.dataset.v=val;
        bt.onclick=()=>{if(ST.done)return;ST.A.ds[i][k]=(ST.A.ds[i][k]===val?null:val);[...row.querySelectorAll("button")].forEach(x=>x.classList.toggle("sel",ST.A.ds[i][k]!==null&&(x.dataset.v==="true")===ST.A.ds[i][k]));upd()};row.appendChild(bt)});
      b.appendChild(row)});sec.appendChild(b)});P.appendChild(sec);
  P.appendChild(Object.assign(document.createElement("h2"),{textContent:"Phần IV. Trả lời ngắn (2,0 điểm – mỗi câu 0,5)"}));
  sec=div("card");
  ex.tln.forEach((q,i)=>{const b=div("q tln");b.appendChild(head(i,q.q,0.5));const inp=document.createElement("input");inp.type="text";inp.setAttribute("inputmode","text");inp.autocomplete="off";inp.placeholder="Nhập đáp số (vd: 12; 3,5; −2; 18π)";
    inp.oninput=()=>{ST.A.tln[i]=inp.value;upd()};b.appendChild(inp);sec.appendChild(b)});P.appendChild(sec);
  // khôi phục lựa chọn
  [...P.querySelectorAll(".card")].forEach(()=>{});
  restoreSel();render(P);
}
function restoreSel(){
  const P=$("#paper"),cards=P.querySelectorAll(".card");
  [["nlc",0],["nlcx",1]].forEach(([key,ci])=>{cards[ci].querySelectorAll(".q").forEach((q,i)=>q.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",+x.dataset.k===ST.A[key][i])))});
  cards[2].querySelectorAll(".q").forEach((q,i)=>q.querySelectorAll(".part").forEach((row,k)=>row.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",ST.A.ds[i][k]!==null&&(x.dataset.v==="true")===ST.A.ds[i][k]))));
  cards[3].querySelectorAll("input").forEach((x,i)=>x.value=ST.A.tln[i]||"");
}
function start(m,seed,A,t0,use){
  ST={ex:buildExam(m,seed),A:A||null,done:false,use:use,t0:t0||Date.now(),sent:false};ST.A=A||fresh();
  $("#home").classList.add("hide");$("#res").classList.add("hide");$("#exam").classList.remove("hide");$("#bar").classList.remove("hide");
  $("#who").textContent=($("#nm").value||"")+" – Lớp "+($("#cl").value||"")+" – Mã đề "+CODES[m]+" (lần tráo "+seed%1000+")";
  $("#sub").classList.remove("hide");paper();upd();window.scrollTo(0,0);tick();clearInterval(timer);timer=setInterval(tick,1000)
}
function tick(){const el=$("#tm");if(!ST||!ST.use){el.textContent="";return}const left=TL-Math.floor((Date.now()-ST.t0)/1000);if(left<=0){el.textContent="Hết giờ";clearInterval(timer);if(!ST.done)submit(true);return}el.textContent=("0"+Math.floor(left/60)).slice(-2)+":"+("0"+left%60).slice(-2)}
let sel=null;
function fold(x){return x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase()}
function fillNames(q){const sl=$("#nm"),cur=sl.value;sl.innerHTML="";const o0=document.createElement("option");o0.value="";o0.textContent="— Chọn tên của em —";sl.appendChild(o0);const k=fold(q||"").trim();const list=NAMES.filter(n=>!k||fold(n).includes(k));list.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sl.appendChild(o)});if(list.length==1&&k)sl.value=list[0];else if(list.includes(cur))sl.value=cur}
function init(){fillNames("");$("#flt").oninput=e=>fillNames(e.target.value);
  const c=$("#codes");CODES.forEach((v,i)=>{const b=document.createElement("button");b.className="code";b.textContent=v;b.onclick=()=>{sel=i;[...c.children].forEach((x,k)=>x.classList.toggle("on",k===i))};c.appendChild(b)});
  $("#go").onclick=()=>{const e=$("#err");if(!$("#nm").value.trim()||sel===null){e.textContent="Hãy chọn tên của em và chọn mã đề.";e.classList.remove("hide");return}e.classList.add("hide");start(sel,7000+sel*13,null,null,$("#usetm").checked)};
  $("#shuf").onclick=async()=>{if(!await ask("Tráo đề sẽ xóa các câu đã làm. Tiếp tục?"))return;const s=Math.floor(Math.random()*900000)+100000;start(ST.ex.m,s,null,null,ST.use)};
  $("#back").onclick=async()=>{if(!ST.done&&!await ask("Thoát sẽ không nộp bài. Tiếp tục thoát?"))return;clearInterval(timer);location.reload()};
  $("#sub").onclick=async()=>{const bl=30-count();if(!await ask(bl>0?"Còn "+bl+" ý/câu chưa làm. Vẫn nộp bài?":"Nộp bài ngay bây giờ?"))return;submit(false)};
  try{const s=JSON.parse(localStorage.getItem("t9ontap")||"null");if(s&&!s.done&&s.A){const r=$("#resume");r.classList.remove("hide");r.innerHTML="";r.appendChild(div("","Bạn có bài đang làm dở (mã "+CODES[s.m]+")."));const b=document.createElement("button");b.className="pri";b.textContent="Tiếp tục làm bài";b.style.marginTop="8px";b.onclick=()=>{$("#nm").value=s.name||"";start(s.m,s.seed,s.A,s.t0,s.use)};r.appendChild(b)}}catch(e){}
}
async function send(p){
  const body=new URLSearchParams();body.append(FORM.name,p.name);body.append(FORM.cls,p.cls);body.append(FORM.ma,p.ma);body.append(FORM.score,p.score);body.append(FORM.detail,p.detail);
  await fetch(FORM.url,{method:"POST",mode:"no-cors",body});
}
function submit(auto){
  ST.done=true;clearInterval(timer);const sc=score(ST.ex,ST.A);ST.sc=sc;
  const payload={name:$("#nm").value.trim(),cls:$("#cl").value.trim(),ma:String(CODES[ST.ex.m]),score:f2(sc.total),
   detail:"Mã "+CODES[ST.ex.m]+" (lần tráo "+ST.ex.seed+") | I: "+f2(sc.s1)+"/3 | II: "+f2(sc.s2)+"/3 | III: "+f2(sc.s3)+"/2 | IV: "+f2(sc.s4)+"/2 | Sai: "+(sc.wrong.join(", ")||"không")+" | Bỏ trống: "+(sc.blank.join(", ")||"không")+(auto?" | (tự nộp khi hết giờ)":"")};
  ST.payload=payload;save();showResult();doSend();
}
async function doSend(){
  const m=$("#sendmsg");m.className="msg wait";m.textContent="Đang gửi điểm cho cô giáo…";
  try{await send(ST.payload);ST.sent=true;m.className="msg ok";m.textContent="Đã gửi điểm cho cô giáo."}catch(e){m.className="msg no";m.textContent="Chưa gửi được điểm (kiểm tra mạng). ";const b=document.createElement("button");b.textContent="Gửi lại";b.onclick=doSend;m.appendChild(b)}
}
function showResult(){
  $("#exam").classList.add("hide");$("#bar").classList.add("hide");const R=$("#res");R.classList.remove("hide");R.innerHTML="";const sc=ST.sc,ex=ST.ex;
  const c=div("card");c.appendChild(div("note",($("#nm").value)+" – Lớp "+$("#cl").value+" – Mã đề "+CODES[ex.m]));c.appendChild(div("big",f2(sc.total)+" / 10"));
  const t=document.createElement("table");t.className="tbl";[["Phần I (NLC)",sc.s1,3],["Phần II (NLC vận dụng)",sc.s2,3],["Phần III (đúng – sai)",sc.s3,2],["Phần IV (trả lời ngắn)",sc.s4,2]].forEach(r=>{const tr=document.createElement("tr");tr.innerHTML="<td></td><td style='text-align:right'></td>";tr.children[0].textContent=r[0];tr.children[1].textContent=f2(r[1])+" / "+r[2];t.appendChild(tr)});c.appendChild(t);
  const sm=div("msg wait");sm.id="sendmsg";c.appendChild(sm);
  const row=div("row");row.style.marginTop="8px";
  const b1=document.createElement("button");b1.textContent="Chép kết quả";b1.onclick=()=>{const tx=$("#nm").value+" – Lớp "+$("#cl").value+" – Mã "+CODES[ex.m]+": "+f2(sc.total)+"/10";(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>b1.textContent="Đã chép",()=>{prompt("Chép đoạn sau:",tx)})};
  const b2=document.createElement("button");b2.className="pri";b2.textContent="Làm lại mã này (tráo đề)";b2.onclick=()=>{const s=Math.floor(Math.random()*900000)+100000;ST.done=false;start(ex.m,s,null,null,ST.use)};
  const b3=document.createElement("button");b3.textContent="Chọn mã khác";b3.onclick=()=>location.reload();
  row.append(b1,b2,b3);c.appendChild(row);R.appendChild(c);
  const rv=div("card");rv.appendChild(div("qt","Đáp án và lời giải"));
  const A=ST.A;
  const mcRes=(list,key,pre,w)=>list.forEach((q,i)=>{const b=div("q");b.appendChild(div("qt",pre+" "+(i+1)+". "+q.q));
    q.opts.forEach((o,k)=>{const d=div("opt"+(k===q.ans?" ok":(A[key][i]===k?" no":"")),L[k]+". "+o);d.style.cssText="padding:8px 12px;border:1px solid var(--bd);border-radius:10px;margin:5px 0";b.appendChild(d)});
    const s=div("sol");s.innerHTML="<b class='"+(A[key][i]===q.ans?"g":"r")+"'>"+(A[key][i]==null?"Bỏ trống":A[key][i]===q.ans?"Đúng":"Sai")+"</b> – Đáp án "+L[q.ans]+". ";s.appendChild(document.createTextNode(q.sol));b.appendChild(s);rv.appendChild(b)});
  mcRes(ex.nlc,"nlc","Phần I – Câu");mcRes(ex.nlcx,"nlcx","Phần II – Câu");
  ex.ds.forEach((cq,i)=>{const b=div("q");b.appendChild(div("qt","Phần III – Câu "+(i+1)+". "+cq.q));cq.parts.forEach((p,k)=>{const v=A.ds[i][k];const d=div("sol");const ok=v===p.ans;d.innerHTML="<b class='"+(ok?"g":"r")+"'>"+(v==null?"Bỏ trống":ok?"Đúng":"Sai")+"</b> – ";d.appendChild(document.createTextNode("abcd"[k]+") "+p.t+" → "+(p.ans?"Đúng":"Sai")+". "+p.sol));b.appendChild(d)});rv.appendChild(b)});
  ex.tln.forEach((q,i)=>{const b=div("q");b.appendChild(div("qt","Phần IV – Câu "+(i+1)+". "+q.q));const v=(A.tln[i]||"").trim();const ok=v&&tlnOK(v,q.ans);const s=div("sol");s.innerHTML="<b class='"+(ok?"g":"r")+"'>"+(!v?"Bỏ trống":ok?"Đúng":"Sai")+"</b> – Bạn nhập: "+(v||"(trống)")+". Đáp số: "+q.ans+". ";s.appendChild(document.createTextNode(q.sol));b.appendChild(s);rv.appendChild(b)});
  R.appendChild(rv);render(R);window.scrollTo(0,0)
}
window.__t={buildExam,score,tlnOK,numval,SRC,mixOpts};
init();
</script>
